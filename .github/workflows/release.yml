name: Release

# A version tag, such as v1.2.0, publishes the image for linux/amd64 and linux/arm64 to the
# repository's GitHub Container Registry, tagged with the version and `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so two tags never race to move `latest`.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Smoke-test the image on ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version the app reports at /api/health comes from package.json.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq --raw-output .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match package.json's version $version."
            exit 1
          fi
      # Each platform is built and run natively on its own runner before anything is published.
      - run: docker build --tag selects:smoke .
      - run: .github/scripts/smoke-test-image.sh selects:smoke

  publish:
    name: Publish the image
    needs: smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the Dockerfile installs each platform's dependencies on the build machine and
      # its final stage only copies files, so no arm64 code runs during the build.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the version here: `latest` moves in the last job, once the pushed image is tested.
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Selects
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=Selects
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  # The image that was pushed, pulled and run on each platform: the build above is not the one
  # the first job tested.
  verify:
    name: Test the published image on ${{ matrix.platform }}
    needs: publish
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and smoke-test the published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          image="$IMAGE:${TAG#v}"
          docker pull "$image"
          .github/scripts/smoke-test-image.sh "$image"

  # `latest` only for a release, never for a pre-release such as v1.0.0-rc.1, and only once the
  # published image has passed on both platforms.
  latest:
    name: Move latest to this version
    needs: verify
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${TAG#v}"
